blueprint:
  id: wax-temporal-behavior-heatmap
  name: Temporal Behavior Heatmap
  tier: forensics-behavioral
  category: analytics
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Pure day×hour activity grid from action timestamps with structural flags.
    Educational companion to organic activity fingerprinter.
  related_blueprints:
    - wax-organic-activity-fingerprinter
    - wax-funding-trail-lineage-graph

invariants:
  - Grid aggregation is pure given timestamps + timezone
  - Flags cite triggers
  - Must not use Math.random for analysis cells
  - Not ban-grade by itself

features:
  implemented:
    - buildHeatmapGrid, fingerprintTemporal, summarizeGrid
    - HeatmapGridView, HeatmapStats, HeatmapFlags, demo
    - app page wired to real engines

machine_instructions:
  - Use examples/engines.ts
  - Always pass explicit timeZone in production
  - Pair with interval entropy tools for richer timing analysis

technical_requirements:
  framework: Next.js + TypeScript
  styling: Tailwind CSS
  data: Hyperion history (production)
